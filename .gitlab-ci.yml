stages: [validate, build, deploy]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # dev/prod에 MR이 열려 있으면 브랜치 파이프라인과 MR 파이프라인이 중복 실행되지 않게 한다.
    - if: '$CI_OPEN_MERGE_REQUESTS && $CI_COMMIT_BRANCH =~ /^(dev|prod)$/'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^(dev|prod)$/'

default:
  interruptible: true
  timeout: 30m

fe:validate:
  stage: validate
  image: node:22-slim
  cache:
    key:
      files: [FE/pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - corepack enable
    - cd FE
    - pnpm config set store-dir ../.pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm lint
    # 기존 파일 3개(FE/INTEGRATION.md, Connected.css, TabletTheme.css)가 Prettier 기준을
    # 만족하지 않아 CI를 막지 않도록 보류한다. FE 담당자가 별도 MR로 정리한 뒤 활성화한다.
    # - pnpm format:check
    - pnpm build
    - pnpm build:tablet

be:validate:
  stage: validate
  image: python:3.14-slim
  cache:
    key:
      files: [BE/requirements.txt, BE/requirements-dev.txt]
    paths: [.cache/pip]
  before_script:
    - cd BE
    - python -m pip install --cache-dir ../.cache/pip -r requirements-dev.txt
  script:
    - ruff check .
    - ruff format --check .
    - python -m mypy
    - python -m pytest

build:images:
  stage: build
  image: docker:27
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
  script:
    - docker build -f BE/Dockerfile -t "imleader/api:$CI_COMMIT_SHA" BE
    - docker build -f deploy/Dockerfile.web -t "imleader/web:$CI_COMMIT_SHA" .

deploy:prod:
  stage: deploy
  image: alpine:3.20
  needs: [build:images]
  interruptible: false
  resource_group: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
  environment:
    name: production
    url: $PUBLIC_URL
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH && git fetch --quiet origin && git checkout --quiet prod && git pull --quiet --ff-only origin prod && REGISTRY_IMAGE=imleader ./deploy/deploy.sh $CI_COMMIT_SHA"
