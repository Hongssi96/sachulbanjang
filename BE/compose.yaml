services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: imleader
      POSTGRES_USER: imleader
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imleader -d imleader"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
