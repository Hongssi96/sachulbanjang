name: imleader

x-api: &api
  image: ${REGISTRY_IMAGE:?set REGISTRY_IMAGE}/api:${IMAGE_TAG:?set IMAGE_TAG}
  env_file: [./.env]
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  networks: [internal]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    <<: *api
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  report-worker:
    <<: *api
    profiles: [ai]
    command: ["python", "-m", "app.commands.run_report_worker"]

  chat-worker:
    <<: *api
    profiles: [ai]
    command: ["python", "-m", "app.commands.run_chat_worker"]

  web:
    image: ${REGISTRY_IMAGE:?set REGISTRY_IMAGE}/web:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  postgres_data:

networks:
  internal:
